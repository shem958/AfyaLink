version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cdp_postgres
    environment:
      POSTGRES_USER: cdp
      POSTGRES_PASSWORD: cdp_secret
      POSTGRES_DB: chronic_disease
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp -d chronic_disease"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cdp_redis
    command: redis-server --appendonly yes --requirepass cdp_redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cdp_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for easy DB browsing
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cdp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cdp.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
